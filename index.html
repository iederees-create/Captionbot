<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matrix Background with Katakana</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: black;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="matrixCanvas"></canvas>

  <script>
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const katakanaChars = ['゠', 'ァ', 'ア', 'ィ', 'イ', 'ゥ', 'ウ', 'ェ', 'エ', 'ォ', 'オ', 'カ', 'ガ', 'キ', 'ギ', 'ク', 'グ', 'ケ', 'ゲ', 'コ', 
      'ゴ', 'サ', 'ザ', 'シ', 'ジ', 'ス', 'ズ', 'セ', 'ゼ', 'ソ', 'ゾ', 'タ', 'ダ', 'チ', 'ヂ', 'ッ', 'ツ', 'ヅ', 'テ', 'デ', 'ト', 'ド', 
      'ナ', 'ニ', 'ヌ', 'ネ', 'ノ', 'ハ', 'バ', 'パ', 'ヒ', 'ビ', 'ピ', 'フ', 'ブ', 'プ', 'ヘ', 'ベ', 'ペ', 'ホ', 'ボ', 'ポ', 'マ', 'ミ', 
      'ム', 'メ', 'モ', 'ャ', 'ヤ', 'ュ', 'ユ', 'ョ', 'ヨ', 'ラ', 'リ', 'ル', 'レ', 'ロ', 'ヮ', 'ワ', 'ヰ', 'ヱ', 'ヲ', 'ン', 'ヴ', 'ヵ', 
      'ヶ', 'ヷ', 'ヸ', 'ヹ', 'ヺ', '・', 'ー', 'ヽ', 'ヾ', 'ヿ'];

    class Symbol {
      constructor(x, y, fontSize, speed) {
        this.x = x;
        this.y = y;
        this.y0 = -fontSize;
        this.fontSize = fontSize;
        this.speed = speed;
        this.charChangeSpeed = Math.floor(Math.random() * (40 - 20) + 20);
        this.value = katakanaChars[Math.floor(Math.random() * katakanaChars.length)];
        this.fontIncrease = 0;
      }

      draw(position) {
        this.fontIncreaseSpeed = Math.floor(this.y / 80);
        this.fontIncrease = (this.y > 0 && this.y < canvas.height) ? this.fontSize + this.fontIncreaseSpeed : 0;

        const font = `${this.fontIncrease}px 'MS Mincho'`;
        const frames = Date.now();
        if (frames % this.charChangeSpeed === 0) {
          this.value = katakanaChars[Math.floor(Math.random() * katakanaChars.length)];
        }

        this.y = (this.y < canvas.height) ? this.y + this.speed : this.y0;

        let charColor;
        if (position < 8) {
          charColor = `rgb(${255 - 32 * position}, 255, ${255 - 32 * position})`;
        } else {
          charColor = `rgb(0, ${255 - 22 * (position - 8)}, 0)`;
        }

        ctx.font = font;
        ctx.fillStyle = charColor;
        ctx.fillText(this.value, this.x, this.y);
      }
    }

    class SymbolColumn {
      constructor(x, y, fontSize) {
        this.columnHeight = Math.floor(Math.random() * (20 - 5) + 5);
        this.speed = Math.floor(Math.random() * (20 - 5) + 5);
        this.fontSize = fontSize;
        this.symbols = [];

        for (let i = y; i > y - (this.fontSize + 10) * this.columnHeight; i -= (this.fontSize + 10)) {
          this.symbols.push(new Symbol(x, i, this.fontSize, this.speed));
        }
      }

      draw() {
        this.symbols.forEach((symbol, index) => {
          symbol.draw(index);
        });
      }
    }

    const symbolColumns = [];
    for (let i = 100; i < canvas.width - 100; i += 200) {
      symbolColumns.push(new SymbolColumn(i, 0, 20));
    }

    function animate() {
      ctx.fillStyle = 'black';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      symbolColumns.forEach(column => {
        column.draw();
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
